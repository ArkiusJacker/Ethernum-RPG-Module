name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify release commit belongs to main
        run: |
          git fetch origin main --no-tags
          npm run validate:topology -- --tag-ref "$GITHUB_REF_NAME" --main-ref "origin/main"

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate manifest
        run: npm run validate:manifest -- --expected-version "${{ steps.version.outputs.VERSION }}"

      - name: Build
        run: npm run build

      - name: Create release zip
        run: |
          cd dist
          zip -r ../ethernum-rpg-module.zip . \
            --exclude "*.DS_Store" \
            --exclude "*Thumbs.db"

      - name: Report package size
        run: npm run report:size -- --zip ethernum-rpg-module.zip --baseline tools/package-size-baseline.json --output package-size-report.json

      - name: Validate distribution
        run: npm run validate:dist -- --expected-version "${{ steps.version.outputs.VERSION }}" --zip ethernum-rpg-module.zip

      - name: Test release archive
        run: unzip -t ethernum-rpg-module.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ethernum-rpg-module.zip
            dist/module.json
            package-size-report.json
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
