{{#if emergency}}
<section class="ethernum-sheet-emergency">
  <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
  <h2>{{localize "ETHERNUM.CharacterSheet.Errors.Render"}}</h2>
  <p>{{errorMessage}}</p>
  <button type="button" data-action="open-pf2e-sheet">
    <i class="fas fa-up-right-from-square" aria-hidden="true"></i>
    <span>PF2e</span>
  </button>
</section>
{{else}}
<form class="ethernum-character-sheet {{shell.themeClass}} {{#if ui.compact}}is-compact{{/if}}"
      data-shell-id="{{shell.id}}"
      data-actor-id="{{actor.id}}"
      aria-label="{{shell.title}}"
      autocomplete="off">
  {{> "modules/ethernum-rpg-module/templates/sheets/base/sheet-base.html"}}
</form>
{{/if}}
